<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run For Koshary</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <canvas id="bg"></canvas>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
            }
        }
    </script>

    <audio id="bg-music" src="background music.mp3" loop></audio>
    <script>
        // Play background music after user interaction
        window.addEventListener('click', function playMusicOnce() {
            const audio = document.getElementById('bg-music');
            if (audio && audio.paused) {
                audio.load();
                audio.play().catch((e) => {
                    // Optionally, show a message or handle the error
                    console.warn('Audio playback failed:', e);
                });
            }
            window.removeEventListener('click', playMusicOnce);
        });
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg') });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        // document.body.appendChild(renderer.domElement); // Already using the canvas with id 'bg'
        camera.position.setZ(5);
        camera.position.setY(3);
        camera.rotation.x = -0.3;
        const loader = new FBXLoader();
        let mixer;

        let characterRef = null;

        // Store reference to character when loaded
        loader.load('/character/Ch42_nonPBR.fbx', function (character) {
            character.scale.set(0.02, 0.02, 0.02);
            character.position.set(0, 0, 0);
            character.rotation.y = Math.PI;
            scene.add(character);
            characterRef = character;

            loader.load('/character/Running (1).fbx', function (anim) {
                mixer = new THREE.AnimationMixer(character);
                if (anim.animations && anim.animations.length > 0) {
                    const action = mixer.clipAction(anim.animations[0]);
                    action.play();
                }
            });
        });
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 5, 5);
        scene.add(light);

        // Listen for keydown events to move character left/right
        window.addEventListener('keydown', (event) => {
            if (!characterRef) return;
            if (event.key === 'a' || event.key === 'A') {
                characterRef.position.x -= 0.1;
            } else if (event.key === 'd' || event.key === 'D') {
                characterRef.position.x += 0.1;
            }
        });

        const gltfLoader = new GLTFLoader();
        // Remove the initial road load here to prevent overlap.
        const movingObjects = [];

        // Helper to spawn a new onion at a random x position
        function spawnOnion() {
            const assets = [
                '/Assets/onion.glb',
                '/Assets/canned_tomato_soup.glb',
                '/Assets/trash_bag.glb',
                '/Assets/single_cooked_macaroni (1).glb'
            ];
            const randomAsset = assets[Math.floor(Math.random() * assets.length)];
            gltfLoader.load(randomAsset, function (gltf) {
                const onion = gltf.scene;
                onion.position.z = -5;
                onion.position.y = 0.5;
                onion.position.x = (Math.random() - 0.5) * 16; // random x between -2 and 2
                if (randomAsset === '/Assets/trash_bag.glb') {
                    onion.scale.set(0.02, 0.02, 0.02);
                } else if (randomAsset === '/Assets/canned_tomato_soup.glb') {
                    onion.scale.set(0.5, 0.5, 0.5);
                } else {
                    onion.scale.set(0.1, 0.1, 0.1);
                }
                scene.add(onion);
                movingObjects.push(onion);
            });
        }
        // Create a timer display
        const timerDiv = document.createElement('div');
        timerDiv.style.position = 'absolute';
        timerDiv.style.top = '20px';
        timerDiv.style.left = '20px';
        timerDiv.style.color = 'white';
        timerDiv.style.fontSize = '2em';
        timerDiv.style.fontFamily = 'Arial, sans-serif';
        timerDiv.style.textShadow = '1px 1px 4px #000';
        timerDiv.textContent = 'Time: 0.0s';
        document.body.appendChild(timerDiv);

        let startTime = Date.now();

        function updateTimer() {
            const elapsed = (Date.now() - startTime) / 1000;
            timerDiv.textContent = `Time: ${elapsed.toFixed(1)}s`;
            requestAnimationFrame(updateTimer);
        }
        updateTimer();
        // Initial onions
        for (let i = 0; i < 3; i++) {
            spawnOnion();
        }

        // Move objects backward and respawn when out of view
        // (Removed duplicate animate function to avoid overwriting the main animate loop)
        // Camera follows the character
        function updateCamera() {
            if (characterRef) {
            // Smooth follow (lerp) for a nicer effect
            const targetZ = characterRef.position.z + 5;
            const targetX = characterRef.position.x;
            camera.position.x += (targetX - camera.position.x) * 0.1;
            camera.position.z += (targetZ - camera.position.z) * 0.1;
            camera.position.y = 3; // Keep constant height
            camera.lookAt(characterRef.position.x, characterRef.position.y + 1, characterRef.position.z);
            }
        }
        let roadRef = null;
        const roadLength = 40; // Adjust based on your road model's length in Z

        // Load two road segments for looping
        gltfLoader.load('/Assets/road__avenue__street.glb', function (gltf) {
            const road1 = gltf.scene;
            road1.position.set(0, 0, 0);
            road1.scale.set(0.05, 0.05, 0.05);
            scene.add(road1);

            // Clone for second segment
            const road2 = road1.clone();
            road2.position.z = -roadLength;
            scene.add(road2);

            roadRef = [road1, road2];
        });

        // Move road segments backward and loop them
        function animate() {
            requestAnimationFrame(animate);

            // Move and loop road segments
            if (roadRef) {
                for (let i = 0; i < roadRef.length; i++) {
                    roadRef[i].position.z += 0.07;
                    // If road is behind camera, move it to the back
                    if (roadRef[i].position.z > camera.position.z + roadLength / 2) {
                        // Find the other segment
                        const other = roadRef[(i + 1) % 2];
                        roadRef[i].position.z = other.position.z - roadLength;
                    }
                }
            }

            // Move onions backward (toward camera)
            for (let i = movingObjects.length - 1; i >= 0; i--) {
                const obj = movingObjects[i];
                obj.position.z += 0.07;
                if (obj.position.z > camera.position.z + 1) {
                    scene.remove(obj);
                    movingObjects.splice(i, 1);
                    spawnOnion();
                }
            }

            if (mixer) mixer.update(0.016);
            renderer.render(scene, camera);
        }
        animate();
        // Update camera position to follow the character each frame
        function animateWithCamera() {
            updateCamera();
            requestAnimationFrame(animateWithCamera);
        }
        animateWithCamera();
        // Alert after 30 seconds
        setTimeout(() => {
            alert("You won koshary 🥘");
        }, 30000);
    </script>
</body>
</html>
