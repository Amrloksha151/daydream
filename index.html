<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run For Koshary</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <canvas id="bg"></canvas>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg') });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        // document.body.appendChild(renderer.domElement); // Already using the canvas with id 'bg'
        camera.position.setZ(5);
        camera.position.setY(2);
        const loader = new FBXLoader();
        let mixer;

        // First load the character, then load the animation and apply it to the character's skeleton
        loader.load('/character/Ch42_nonPBR.fbx', function (character) {
            character.scale.set(0.02, 0.02, 0.02);
            character.position.set(0, 0, 0);
            scene.add(character);

            loader.load('/character/Running (1).fbx', function (anim) {
                mixer = new THREE.AnimationMixer(character);
                if (anim.animations && anim.animations.length > 0) {
                    const action = mixer.clipAction(anim.animations[0]);
                    action.play();
                }
            });
        });
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 5, 5);
        scene.add(light);

        // Update the mixer in the animation loop
        const prevAnimate = animate;
        function animate() {
            requestAnimationFrame(animate);
            if (mixer) mixer.update(0.016);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
